{% extends 'base.html' %}
{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 30px;">
        <h2>Mis Plantillas Guardadas</h2>
        <a href="{% url 'teams:pitch' %}" class="btn" target="_blank">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 5px;"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nueva Plantilla
        </a>
    </div>
    
    <!-- Grid de Plantillas (Moderno) -->
    <div class="dashboard-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">
        
        <!-- Tarjeta: Crear Nueva (Empty State) -->
        <div class="create-new-card" style="background: rgba(255,255,255,0.02); border: 2px dashed #555; border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;" onmouseover="this.style.borderColor='#e2b714'; this.style.background='rgba(226, 183, 20, 0.05)';" onmouseout="this.style.borderColor='#555'; this.style.background='rgba(255,255,255,0.02)';" onclick="window.open('{% url \'teams:pitch\' %}', '_blank')">
            <div style="background: rgba(226, 183, 20, 0.1); padding: 15px; border-radius: 50%; margin-bottom: 15px;">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e2b714" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            </div>
            <h3 style="margin-bottom: 5px; color: #fff;">Crear Pizarra</h3>
            <p style="color: #aaa; font-size: 0.9em; margin: 0;">Diseña una nueva formación y táctica desde cero.</p>
        </div>

        <!-- Aquí en el futuro se iterarán las plantillas guardadas por el usuario (ej. {% for team in user_teams %}...) -->
    </div>
</div>
{% endblock %}
